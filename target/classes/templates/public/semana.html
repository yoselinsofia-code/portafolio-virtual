<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title th:text="'Semana ' + ${semana.numeroSemana} + ' — ' + ${semana.titulo} + ' · Portafolio Académico'">Semana</title>
    <th:block th:replace="~{layout/public :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{layout/public :: navbar}"></nav>

<div class="contenedor">
    <div class="breadcrumb-publico">
        <a th:href="@{/}">Inicio</a> <i class="fa-solid fa-chevron-right" style="font-size:.65rem;"></i>
        <span th:text="'Semana ' + ${semana.numeroSemana}">Semana</span>
    </div>
</div>

<header class="hero-publico" style="padding:50px 0 70px;">
    <div class="contenedor">
        <div class="glass-card" style="padding:38px; display:flex; gap:26px; align-items:center; flex-wrap:wrap;">
            <div class="numero-flotante" style="position:static; width:74px; height:74px;">
                <small>Semana</small>
                <strong style="font-size:1.6rem;" th:text="${#numbers.formatInteger(semana.numeroSemana, 2)}">01</strong>
            </div>
            <div style="flex:1; min-width:240px;">
                <h1 style="font-size:1.8rem; margin:0 0 8px;" th:text="${semana.titulo}">Título</h1>
                <p style="color:var(--gris-texto); margin:0; line-height:1.6;" th:text="${semana.descripcion}">Descripción</p>
            </div>
        </div>
    </div>
</header>

<section class="section-publica" style="padding-top:0;">
    <div class="contenedor">
        <div class="section-header">
            <span class="eyebrow">Contenido de la semana</span>
            <h2>Actividades</h2>
        </div>

        <div th:if="${#lists.isEmpty(actividades)}" class="empty-state-publico">
            <i class="fa-solid fa-inbox"></i>
            <p>Todavía no hay actividades publicadas para esta semana.</p>
        </div>

        <div class="actividades-publico-grid" th:unless="${#lists.isEmpty(actividades)}">
            <a th:each="actividad : ${actividades}" th:href="@{/actividad/{id}(id=${actividad.id})}" class="actividad-publica-card" style="display:block;"
               th:with="tipoNombre=${actividad.tipoActividad.name()},
                        acento=(${tipoNombre == 'EJERCICIO'} ? 'tipo-acento-1' :
                               (${tipoNombre == 'TAREA'} ? 'tipo-acento-2' :
                               (${tipoNombre == 'PROYECTO'} ? 'tipo-acento-3' :
                               (${tipoNombre == 'INVESTIGACION'} ? 'tipo-acento-4' :
                               (${tipoNombre == 'PRACTICA'} ? 'tipo-acento-5' :
                               (${tipoNombre == 'EXAMEN'} ? 'tipo-acento-6' : 'tipo-acento-7'))))))">
                <span class="tipo-pill-publico" th:classappend="${acento}" th:text="${actividad.tipoActividad.etiqueta}">Tipo</span>
                <img th:if="${actividad.imagen != null}" th:src="@{'/uploads/' + ${actividad.imagen}}"
                     style="width:100%; height:140px; object-fit:cover; border-radius:14px; margin-bottom:14px;" alt=""/>
                <h4 th:text="${actividad.titulo}">Título</h4>
                <p th:text="${actividad.descripcion != null ? #strings.abbreviate(actividad.descripcion, 90) : 'Sin descripción'}">
                    Descripción
                </p>
                <span class="link-ver-mas">Ver actividad <i class="fa-solid fa-arrow-right"></i></span>
            </a>
        </div>
    </div>
</section>

<footer th:replace="~{layout/public :: footer}"></footer>
<th:block th:replace="~{layout/public :: scripts}"></th:block>
</body>
</html>
