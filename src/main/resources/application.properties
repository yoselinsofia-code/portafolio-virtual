# ============================================
# CONFIGURACION GENERAL
# ============================================
spring.application.name=portafolio-academico
server.port=8080

# ============================================
# BASE DE DATOS MYSQL
# ============================================
# Antes de ejecutar, crea la base de datos:
#   CREATE DATABASE portafolio_academico CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/portafolio_academico?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Habilitado para que las relaciones LAZY (ej. actividad.semana) puedan
# cargarse sin problemas mientras Thymeleaf renderiza la vista.
spring.jpa.open-in-view=true

# ============================================
# THYMELEAF
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================================
# CARGA DE ARCHIVOS (imagenes, PDFs)
# ============================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# ============================================
# USUARIO ADMINISTRADOR POR DEFECTO
# (se crea automaticamente la primera vez que se ejecuta la app)
# ============================================
app.admin.default-username=admin
app.admin.default-password=admin123
app.admin.default-email=admin@portafolio.com

# ============================================
# USUARIO DOCENTE POR DEFECTO (solo lectura)
# (se crea automaticamente la primera vez que se ejecuta la app)
# ============================================
app.docente.default-username=docente
app.docente.default-password=docente123
app.docente.default-email=docente@portafolio.com

# Logging
logging.level.org.springframework.security=INFO
