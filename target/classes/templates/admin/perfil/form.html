<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Mi Perfil · Portafolio Académico</title>
    <th:block th:replace="~{layout/admin :: styles}"></th:block>
</head>
<body>
<div class="app-layout">

    <div th:replace="~{layout/admin :: sidebar(activePage='perfil')}"></div>

    <main class="main-content">
        <div th:replace="~{layout/admin :: topbar(titulo='Mi perfil', subtitulo='Estos datos se mostrarán en tu portafolio público')}"></div>

        <div class="alert-custom alert-exito" th:if="${exito}" th:text="${exito}"></div>

        <div class="perfil-header-card">
            <div class="perfil-avatar-grande">
                <img th:if="${perfil.fotoPerfil != null}" th:src="@{'/uploads/' + ${perfil.fotoPerfil}}" alt=""/>
                <span th:unless="${perfil.fotoPerfil != null}" th:text="${perfil.nombres != null and !perfil.nombres.isEmpty() ? #strings.substring(perfil.nombres,0,1) : 'P'}">P</span>
            </div>
            <div>
                <h2 style="color:white; margin:0 0 6px;" th:text="(${perfil.nombres} ?: 'Mi') + ' ' + (${perfil.apellidos} ?: 'Nombre')">Nombre</h2>
                <p style="opacity:.9; margin:0;" th:text="(${perfil.carrera} ?: 'Tu carrera') + ' · ' + (${perfil.instituto} ?: 'Tu instituto')">Carrera</p>
            </div>
        </div>

        <div class="panel" style="max-width:820px;">
            <form th:action="@{/admin/perfil/guardar}" th:object="${perfil}" method="post" enctype="multipart/form-data" class="form-elegante">
                <input type="hidden" th:field="*{id}"/>

                <h3 style="margin-top:0;">Datos personales</h3>
                <div class="form-row">
                    <div>
                        <label>Nombres *</label>
                        <input type="text" th:field="*{nombres}" required placeholder="Ej: María"/>
                    </div>
                    <div>
                        <label>Apellidos *</label>
                        <input type="text" th:field="*{apellidos}" required placeholder="Ej: García López"/>
                    </div>
                </div>

                <label>Foto de perfil</label>
                <div class="form-file-drop" onclick="document.getElementById('archivoFoto').click();">
                    <i class="fa-solid fa-camera"></i>
                    <span class="drop-label">Haz clic para subir tu foto</span>
                    <input type="file" id="archivoFoto" name="archivoFoto" accept="image/*"/>
                </div>

                <label>Descripción personal</label>
                <textarea th:field="*{descripcion}" placeholder="Cuéntanos brevemente sobre ti..."></textarea>

                <h3>Datos académicos</h3>
                <div class="form-row">
                    <div>
                        <label>Carrera</label>
                        <input type="text" th:field="*{carrera}" placeholder="Ej: Ingeniería de Sistemas"/>
                    </div>
                    <div>
                        <label>Instituto / Universidad</label>
                        <input type="text" th:field="*{instituto}" placeholder="Ej: Instituto Superior..."/>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Curso</label>
                        <input type="text" th:field="*{curso}" placeholder="Ej: Programación en Java"/>
                    </div>
                    <div>
                        <label>Docente</label>
                        <input type="text" th:field="*{docente}" placeholder="Ej: Ing. Juan Pérez"/>
                    </div>
                </div>

                <h3>Contacto y redes sociales</h3>
                <div class="form-row">
                    <div>
                        <label>Correo</label>
                        <input type="email" th:field="*{correo}" placeholder="tucorreo@ejemplo.com"/>
                    </div>
                    <div>
                        <label>GitHub</label>
                        <input type="url" th:field="*{github}" placeholder="https://github.com/tuusuario"/>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>LinkedIn</label>
                        <input type="url" th:field="*{linkedin}" placeholder="https://linkedin.com/in/tuusuario"/>
                    </div>
                    <div>
                        <label>Instagram</label>
                        <input type="url" th:field="*{instagram}" placeholder="https://instagram.com/tuusuario"/>
                    </div>
                </div>
                <label>Facebook</label>
                <input type="url" th:field="*{facebook}" placeholder="https://facebook.com/tuusuario"/>

                <div class="form-actions">
                    <a th:href="@{/admin/dashboard}" class="btn-elegante btn-secundario">Cancelar</a>
                    <button type="submit" class="btn-elegante btn-primario"><i class="fa-solid fa-floppy-disk"></i> Guardar perfil</button>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{layout/admin :: scripts}"></th:block>
</body>
</html>
