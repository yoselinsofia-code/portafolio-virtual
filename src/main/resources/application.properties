                                                                        # ============================================
# CONFIGURACION GENERAL
# ============================================
spring.application.name=portafolio-academico
server.port=${PORT:8080}

# ============================================
# BASE DE DATOS MYSQL
# Los valores se pueden cambiar mediante variables de entorno.
# En Docker, MYSQL_HOST debe ser el nombre del servicio: mysql
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portafolio_academico?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ============================================
# THYMELEAF
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================================
# CARGA DE ARCHIVOS
# En Docker se monta como volumen /app/uploads
# ============================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# ============================================
# USUARIO ADMINISTRADOR POR DEFECTO
# ============================================
app.admin.default-username=${APP_ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD:admin123}
app.admin.default-email=${APP_ADMIN_DEFAULT_EMAIL:admin@portafolio.com}

# ============================================
# USUARIO DOCENTE POR DEFECTO
# ============================================
app.docente.default-username=${APP_DOCENTE_DEFAULT_USERNAME:docente}
app.docente.default-password=${APP_DOCENTE_DEFAULT_PASSWORD:docente123}
app.docente.default-email=${APP_DOCENTE_DEFAULT_EMAIL:docente@portafolio.com}

# Logging
logging.level.org.springframework.security=INFO
