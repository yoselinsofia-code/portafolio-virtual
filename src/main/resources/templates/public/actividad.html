<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title th:text="${actividad.titulo} + ' · Portafolio Académico'">Actividad</title>
    <th:block th:replace="~{layout/public :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{layout/public :: navbar}"></nav>

<div class="contenedor">
    <div class="breadcrumb-publico">
        <a th:href="@{/}">Inicio</a> <i class="fa-solid fa-chevron-right" style="font-size:.65rem;"></i>
        <a th:href="@{/semana/{id}(id=${actividad.semana.id})}" th:text="'Semana ' + ${actividad.semana.numeroSemana}">Semana</a>
        <i class="fa-solid fa-chevron-right" style="font-size:.65rem;"></i>
        <span th:text="${actividad.titulo}">Actividad</span>
    </div>
</div>

<section class="section-publica" style="padding-top:10px;">
    <div class="contenedor">
        <div class="glass-card" style="padding:38px; max-width:820px; margin:0 auto;"
             th:with="tipoNombre=${actividad.tipoActividad.name()},
                      acento=(${tipoNombre == 'EJERCICIO'} ? 'tipo-acento-1' :
                             (${tipoNombre == 'TAREA'} ? 'tipo-acento-2' :
                             (${tipoNombre == 'PROYECTO'} ? 'tipo-acento-3' :
                             (${tipoNombre == 'INVESTIGACION'} ? 'tipo-acento-4' :
                             (${tipoNombre == 'PRACTICA'} ? 'tipo-acento-5' :
                             (${tipoNombre == 'EXAMEN'} ? 'tipo-acento-6' : 'tipo-acento-7'))))))">
            <span class="tipo-pill-publico" th:classappend="${acento}" th:text="${actividad.tipoActividad.etiqueta}">Tipo</span>
            <h1 style="font-size:1.7rem; margin:14px 0 6px;" th:text="${actividad.titulo}">Título</h1>
            <p style="color:var(--gris-suave); font-size:.85rem; margin-bottom:20px;" th:if="${actividad.fecha != null}">
                <i class="fa-regular fa-calendar"></i> <span th:text="${actividad.fecha}"></span>
            </p>

            <img th:if="${actividad.imagen != null}" th:src="@{'/uploads/' + ${actividad.imagen}}"
                 style="width:100%; max-height:340px; object-fit:cover; border-radius:18px; margin-bottom:22px; box-shadow:var(--sombra-media);" alt=""/>

            <p style="line-height:1.8; color:var(--gris-texto);" th:text="${actividad.descripcion}">Descripción</p>

            <div th:if="${actividad.codigoJava != null and !actividad.codigoJava.isEmpty()}" class="codigo-java-publico">
                <span class="etiqueta"><i class="fa-brands fa-java"></i> Código Java</span>
                <code th:text="${actividad.codigoJava}"></code>
            </div>

            <div class="actividad-publica-links" style="margin-top:26px;">
                <a th:if="${actividad.enlaceExterno != null and !actividad.enlaceExterno.isEmpty()}" th:href="${actividad.enlaceExterno}" target="_blank" class="chip-link">
                    <i class="fa-solid fa-up-right-from-square"></i> Ver enlace externo
                </a>
                <a th:if="${actividad.archivoPdf != null}" th:href="@{'/uploads/' + ${actividad.archivoPdf}}" target="_blank" class="chip-link">
                    <i class="fa-solid fa-file-pdf"></i> Descargar PDF
                </a>
            </div>

            <div style="margin-top:30px;">
                <a th:href="@{/semana/{id}(id=${actividad.semana.id})}" class="chip-link"><i class="fa-solid fa-arrow-left"></i> Volver a la semana</a>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{layout/public :: footer}"></footer>
<th:block th:replace="~{layout/public :: scripts}"></th:block>
</body>
</html>
