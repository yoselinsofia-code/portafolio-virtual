<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title th:text="${actividad.titulo} + ' · Panel del Docente'">Actividad</title>
    <th:block th:replace="~{layout/docente :: styles}"></th:block>
</head>
<body>
<div class="app-layout">

    <div th:replace="~{layout/docente :: sidebar(activePage='semanas')}"></div>

    <main class="main-content">
        <div th:replace="~{layout/docente :: topbar(titulo=${actividad.titulo}, subtitulo=${actividad.tipoActividad.etiqueta})}"></div>

        <div class="breadcrumb-elegante">
            <a th:href="@{/docente/dashboard}">Panel del docente</a> <i class="fa-solid fa-chevron-right" style="font-size:.7rem;"></i>
            <a th:href="@{/docente/semanas/{id}(id=${actividad.semana.id})}" th:text="'Semana ' + ${actividad.semana.numeroSemana}">Semana</a>
            <i class="fa-solid fa-chevron-right" style="font-size:.7rem;"></i>
            <span th:text="${actividad.titulo}">Actividad</span>
        </div>

        <div class="panel" style="max-width:820px;">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <span class="tipo-pill" th:text="${actividad.tipoActividad.etiqueta}">Tipo</span>
                <span class="badge-estado" th:classappend="${actividad.estado.name() == 'PUBLICADO'} ? 'badge-publicado' : 'badge-pendiente'" th:text="${actividad.estado.etiqueta}">Estado</span>
                <span style="margin-left:auto; color:var(--gris-suave); font-size:.85rem;" th:if="${actividad.fecha != null}">
                    <i class="fa-regular fa-calendar"></i> <span th:text="${actividad.fecha}"></span>
                </span>
            </div>

            <h2 style="margin:16px 0 8px;" th:text="${actividad.titulo}">Título</h2>
            <p style="color:var(--gris-texto); line-height:1.6;" th:text="${actividad.descripcion}">Descripción</p>

            <img th:if="${actividad.imagen != null}" th:src="@{'/uploads/' + ${actividad.imagen}}"
                 style="width:100%; max-height:360px; object-fit:cover; border-radius:16px; box-shadow:var(--sombra-suave); margin-top:14px;" alt=""/>

            <div th:if="${actividad.codigoJava != null and !actividad.codigoJava.isEmpty()}" class="codigo-java-box" style="margin-top:20px;">
                <label style="display:block; font-size:.85rem; font-weight:600; color:var(--oscuro-2); margin-bottom:6px;">Código Java</label>
                <textarea readonly style="width:100%; padding:14px 16px; border-radius:var(--radio-sm); border:1.5px solid #ecdfe6;" th:text="${actividad.codigoJava}"></textarea>
            </div>

            <div style="display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;">
                <a th:if="${actividad.enlaceExterno != null and !actividad.enlaceExterno.isEmpty()}" th:href="${actividad.enlaceExterno}" target="_blank" class="btn-elegante btn-secundario">
                    <i class="fa-solid fa-up-right-from-square"></i> Enlace externo
                </a>
                <a th:if="${actividad.archivoPdf != null}" th:href="@{'/uploads/' + ${actividad.archivoPdf}}" target="_blank" class="btn-elegante btn-secundario">
                    <i class="fa-solid fa-file-pdf"></i> Ver PDF
                </a>
            </div>

            <div class="form-actions">
                <a th:href="@{/docente/semanas/{id}(id=${actividad.semana.id})}" class="btn-elegante btn-secundario">Volver a la semana</a>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{layout/docente :: scripts}"></th:block>
</body>
</html>
